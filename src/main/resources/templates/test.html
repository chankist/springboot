<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" th:href="@{/css/style.css}">
<title>thymeleaf 문법 연습</title>
</head>
<body>
	<div th:replace="~{fragments/header :: header}"></div>
	

	<h2>Thymleaf 연습 출력</h2>
	<hr>
	<h3>이름 : <span th:text="${name}"></span></h3>
	<h3>나이 : <span th:text="${age}"></span></h3>
	<h2 th:text="${name}"></h2>
	<hr>
	<p th:if="${age > 20}">성인입니다.</p>
	<p th:if="${age < 20}">미성년자입니다.</p>
	<p th:if="${loginId}">tiger님 로그인 중 미성인입니다.</p>
	<p th:if="${age > 20}">성인입니다.</p>
	<p th:unless="${age >= 20}">미성년자입니다</p>
	<hr>
	<h2>반복문</h2>
	<table border="1">
		<tr>
			<th>번호</th>
			<th>이름</th>
		</tr>
		
		<tr th:each="name, status :${strs}">
			<td th:text="${status.count}">번호</td>
			<td><a th:href="@{/question/list}" th:text="${name}"></a></td>
		</tr>
		
	</table>
	
	<hr>
	<h2>이미지 불러오기</h2>
	<img th:src="@{img/rose.jpg}">
	<br>
	<form action="@{/loginok}">
		아이디 : <input type="text" name="userid">
	</form>
	
	<div th:replace="~{fragments/footer :: footer}"></div>
		
</body>
</html>
